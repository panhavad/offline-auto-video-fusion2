services:
  # Production-like static build served by nginx: http://localhost:8080
  app:
    build:
      context: .
      target: runtime
    image: auto-video-fusion:latest
    container_name: auto-video-fusion
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

  # Vite dev server with hot reload: docker compose --profile dev up dev
  dev:
    build:
      context: .
      target: dev
    image: auto-video-fusion-dev:latest
    container_name: auto-video-fusion-dev
    profiles: ["dev"]
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      # Keep the image's node_modules (built for Linux) instead of the host's.
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
