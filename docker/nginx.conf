server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# WebCodecs + File System Access need a secure context; localhost counts as one.
	# Terminate TLS in front of this container when serving a real hostname.

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

	# Hashed Vite assets never change under the same name.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# The service worker and the shell must always be revalidated, otherwise a
	# stale worker would keep serving an old precache forever.
	location = /sw.js {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		try_files $uri =404;
	}

	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	location = /manifest.webmanifest {
		default_type application/manifest+json;
		add_header Cache-Control "no-cache";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
